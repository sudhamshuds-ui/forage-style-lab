ont-family="Inter, sans-serif" font-size="14">Small: five thin lime wheels in two clusters, on a diagonal across the salmon.</text><text x="16" y="714" fill="#cfcfcf" font-family="Inter, sans-serif" font-size="14">Circular: the foam on the golden circle; the garnish rings the salmon in odd numbers.</text></svg>