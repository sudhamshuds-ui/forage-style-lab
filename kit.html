<!doctype html>
<!-- The Forage kit: one ingredient on the table, with the parameters a dish is built from
     (how it is prepared, how hot it is cooked, how much of it). A workbench for the kitchen's dishes. -->
<html lang="en" data-loader="fill">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forage Kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="lab kitchen kit">
    <main class="kitchen-page">
      <div class="kitchen-main">
        <h1 class="lab-title">Forage</h1>
        <div class="card" id="card">
          <canvas id="canvas" aria-label="3D view of the ingredient"></canvas>
          <!-- The outline on the hovered or selected ingredient (kitchen/outline.ts fills in the path). -->
          <svg class="outline" id="outline" data-state="off" preserveAspectRatio="none" aria-hidden="true">
            <path class="outline-fill" />
            <path class="outline-shade" />
            <path class="outline-dash" />
          </svg>
          <!-- How many: less and more, beside the ingredient once it is selected. -->
          <div class="qty" id="qty" role="group" aria-label="Quantity" hidden>
            <button type="button" id="qty-less" aria-label="Less">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12" /></svg>
            </button>
            <span class="qty-count" id="qty-count" aria-live="polite">1</span>
            <button type="button" id="qty-more" aria-label="More">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12" /></svg>
            </button>
          </div>
          <!-- New ingredient and the brush with its painters (ui/styleBar.tsx). -->
          <div class="bar-root" id="bar-root"></div>
        </div>
        <p class="hint">Click the ingredient to change how much. Drag to rotate</p>
      </div>
      <div class="cook-side">
        <p class="cook-caption">Kit parameters</p>
        <aside class="cook-panel" id="kit-panel" aria-label="Kit parameters"></aside>
      </div>
    </main>
    <script type="module" src="/src/kit/main.ts"></script>
  </body>
</html>
