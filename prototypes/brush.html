<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forage brush slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="brp">
    <!--
      UI round 3 (the user's Figma directions, node 124:352). The real Style Lab runs underneath
      (same ids as index.html) with its panel hidden; React draws the controls on the card.
    -->
    <div class="app">
      <main class="stage-area">
        <div class="br-layout">
          <h1 class="br-title">Forage pantry</h1>
          <div class="card" id="card">
            <canvas id="canvas" aria-label="3D view of the ingredient"></canvas>
            <div class="br-root" id="brush-root"></div>
          </div>
          <p class="br-hint" id="br-hint">Drag to rotate. Scroll or pinch to zoom.</p>
        </div>
      </main>

      <aside class="panel" aria-hidden="true">
        <div class="panel-head">
          <h2 id="ingredient-name">Apple</h2>
          <button type="button" class="btn btn-shuffle" id="btn-shuffle-ingredient" tabindex="-1">Shuffle ingredient</button>
        </div>
        <div class="panel-body">
          <section class="palette" id="palette"></section>
          <div id="pane"></div>
        </div>
        <div class="panel-foot">
          <button type="button" class="btn" id="btn-reset" tabindex="-1">Reset</button>
        </div>
      </aside>
    </div>
    <div id="picker-root"></div>

    <script type="module" src="/src/prototypes/brush/main.tsx"></script>
  </body>
</html>
