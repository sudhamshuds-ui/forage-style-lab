<!doctype html>
<!-- The kitchen: put up to three ingredients on the table, set how to cook them, cook.
     (Branch `kitchen`, first round: the table, the tray and the cooking panel.) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forage Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="lab kitchen">
    <main class="kitchen-page">
      <div class="kitchen-main">
        <h1 class="lab-title" id="page-title" aria-live="polite">Forage</h1>
        <div class="card" id="card">
          <canvas id="canvas" aria-label="The table: the ingredients you are cooking with"></canvas>
          <!-- The outline on the hovered or selected ingredient (outline.ts fills in the path). -->
          <svg class="outline" id="outline" data-state="off" preserveAspectRatio="none" aria-hidden="true">
            <path class="outline-fill" />
            <path class="outline-shade" />
            <path class="outline-dash" />
          </svg>
          <button type="button" class="remove-item" id="remove-item" hidden>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <p class="empty-hint" id="empty-hint" data-show="true">Drag an ingredient onto the table</p>
          <!-- The result screen's buttons (shown once a dish is on the card). -->
          <div class="result-bar" id="result-bar">
            <button type="button" class="result-save" id="btn-save">Save recipe</button>
            <button type="button" class="result-back" id="btn-back" aria-label="Back to the table" title="Back to the table">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
            </button>
          </div>
          <!-- Cook and the brush with its painters (ui/styleBar.tsx). -->
          <div class="bar-root" id="bar-root"></div>
        </div>
        <!-- Under the card: the tray while choosing, the dish's description once cooked. -->
        <div class="below-card">
          <div class="tray-wrap">
            <div class="tray" id="tray"></div>
            <p class="hint">Drag ingredients onto the table, up to three</p>
          </div>
          <p class="dish-text" id="dish-text"></p>
        </div>
      </div>
      <!-- The cooking choices (panel.ts). -->
      <aside class="cook-panel" id="cook-panel" aria-label="How to cook it"></aside>
    </main>
    <script type="module" src="/src/kitchen/main.ts"></script>
  </body>
</html>
