<!doctype html>
<!-- The kitchen: put up to three ingredients on the table, set how to cook them, cook.
     (Branch `kitchen`, first round: the table, the tray and the cooking panel.) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forage Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="lab kitchen">
    <main class="kitchen-page">
      <div class="kitchen-main">
        <h1 class="lab-title">Forage</h1>
        <div class="card" id="card">
          <canvas id="canvas" aria-label="The table: the ingredients you are cooking with"></canvas>
          <!-- The outline on the hovered or selected ingredient (outline.ts fills in the path). -->
          <svg class="outline" id="outline" data-state="off" preserveAspectRatio="none" aria-hidden="true">
            <path class="outline-fill" />
            <path class="outline-shade" />
            <path class="outline-dash" />
          </svg>
          <button type="button" class="remove-item" id="remove-item" hidden>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <p class="empty-hint" id="empty-hint" data-show="true">Drag an ingredient onto the table</p>
          <div class="bar-root">
            <div class="sb">
              <button type="button" class="sb-new" id="btn-cook" disabled>Cook</button>
              <div class="sb-split">
                <button type="button" class="sb-brush" id="btn-brush" aria-label="Painterly look" aria-pressed="false">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08" />
                    <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- The ingredient tray (tray.ts). -->
        <div class="tray" id="tray"></div>
        <p class="hint">Drag an ingredient onto the table, up to three. Click one on the table to remove it</p>
      </div>
      <!-- The cooking choices (panel.ts). -->
      <aside class="cook-panel" id="cook-panel" aria-label="Cooking methods"></aside>
    </main>
    <script type="module" src="/src/kitchen/main.ts"></script>
  </body>
</html>
